plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }
    implementation fg.deobf("maven.modrinth:kaleidoscope-cookery:${cookery_version_id}")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("maven.modrinth:patchouli:94dtOLgZ")
runtimeOnly fg.deobf("maven.modrinth:patchouli:94dtOLgZ")
runtimeOnly fg.deobf("maven.modrinth:vanillabackport:u8YPiN39")
runtimeOnly fg.deobf("maven.modrinth:platform:aWxR0Ksa")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")

    compileOnly fg.deobf("maven.modrinth:sodium-dynamic-lights:I156ee3A")
    compileOnly fg.deobf("maven.modrinth:ryoamiclights:zfxPcTIH")

    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-core:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-common:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-lib:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-gui:${jei_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
